name: gdio Secure Export Pipeline

on:
  workflow_dispatch:

env:
  GODOT_TAG: "4.7.2.stable"
  CSHARP: "false"
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.SCRIPT_AES256_ENCRYPTION_KEY }}
  SCONSFLAGS: verbose=yes warnings=all

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_windows: ${{ steps.check.outputs.has_windows }}
      has_linux: ${{ steps.check.outputs.has_linux }}
      has_macos: ${{ steps.check.outputs.has_macos }}
      has_web: ${{ steps.check.outputs.has_web }}
      has_android: ${{ steps.check.outputs.has_android }}
      has_ios: ${{ steps.check.outputs.has_ios }}
      has_visionos: ${{ steps.check.outputs.has_visionos }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect platforms from export presets
        id: check
        shell: bash
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "No export_presets.cfg found."
            for p in has_windows has_linux has_macos has_web has_android has_ios has_visionos; do
              echo "$p=false" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          has_windows=false; has_linux=false; has_macos=false
          has_web=false; has_android=false; has_ios=false; has_visionos=false
          while IFS= read -r line; do
            val="${line#*\"}"; val="${val%\"*}"
            case "$val" in
              "Windows"|"Windows Desktop") has_windows=true ;;
              "Linux"|"Linux/X11") has_linux=true ;;
              "macOS"|"Mac OSX") has_macos=true ;;
              "Web"|"HTML5") has_web=true ;;
              "Android") has_android=true ;;
              "iOS") has_ios=true ;;
              "visionOS") has_visionos=true ;;
            esac
          done < <(grep '^platform=' export_presets.cfg)
          echo "has_windows=$has_windows" >> "$GITHUB_OUTPUT"
          echo "has_linux=$has_linux" >> "$GITHUB_OUTPUT"
          echo "has_macos=$has_macos" >> "$GITHUB_OUTPUT"
          echo "has_web=$has_web" >> "$GITHUB_OUTPUT"
          echo "has_android=$has_android" >> "$GITHUB_OUTPUT"
          echo "has_ios=$has_ios" >> "$GITHUB_OUTPUT"
          echo "has_visionos=$has_visionos" >> "$GITHUB_OUTPUT"

  secure-export-windows:
    needs: detect
    if: needs.detect.outputs.has_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: env.CSHARP == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Validate AES-256 encryption key
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SCRIPT_AES256_ENCRYPTION_KEY"
          if [ -z "${SCRIPT_AES256_ENCRYPTION_KEY:-}" ]; then
            echo "ERROR: SCRIPT_AES256_ENCRYPTION_KEY is empty."
            exit 1
          fi
          if ! [[ "$SCRIPT_AES256_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Key must contain exactly 64 hex characters."
            exit 1
          fi
          echo "[OK] AES-256 key format is valid."

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\uben2\cache
            godot\.scons_cache
          key: scons-windows-${{ env.GODOT_TAG }}-${{ hashFiles('godot/**') }}
          restore-keys: scons-windows-${{ env.GODOT_TAG }}

      - name: Cache editor build
        id: editor-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/windows-editor/
          key: editor-windows-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: editor-windows-${{ env.GODOT_TAG }}

      - name: Cache export templates
        id: template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/windows-templates/
          key: templates-windows-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-windows-${{ env.GODOT_TAG }}

      - name: Install build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          choco install -y python3 scons
          pip install scons

      - name: Clone Godot
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GODOT_BRANCH=$(echo "$GODOT_TAG" | sed 's/\.\([a-z].*\)/-\1/')
          if [ ! -d godot/.git ]; then
            rm -rf godot
            git clone --depth 1 --branch "$GODOT_BRANCH" \
              https://github.com/godotengine/godot.git godot
          fi

      - name: Download Godot-Secure script (latest release)
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          LATEST_URL=$(curl -fsSL -H "User-Agent: curl" https://api.github.com/repos/KnifeXRage/Godot-Secure/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*Godot\.Secure\.AES-256\.Universal\.[^"]*\.py"' \
            | head -1 | sed 's/"browser_download_url": *"//;s/"$//')
          if [ -z "$LATEST_URL" ]; then
            echo "ERROR: Could not find Godot-Secure script in latest release"
            exit 1
          fi
          GODOT_SECURE_SCRIPT=$(basename "$LATEST_URL")
          curl -fsSL -o "$GODOT_SECURE_SCRIPT" "$LATEST_URL"
          echo "GODOT_SECURE_SCRIPT=$GODOT_SECURE_SCRIPT" >> "$GITHUB_ENV"
          echo "[OK] Downloaded $GODOT_SECURE_SCRIPT"

      - name: Save baseline
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/godot_secure_baseline
          cp godot/core/io/file_access_pack.h /tmp/godot_secure_baseline/
          cp godot/core/io/file_access_encrypted.h /tmp/godot_secure_baseline/
          cp godot/core/io/file_access_encrypted.cpp /tmp/godot_secure_baseline/

      - name: Apply Godot Secure
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SCRIPT_AES256_ENCRYPTION_KEY="$SCRIPT_AES256_ENCRYPTION_KEY"
          set +e
          printf 'y\nn\ny\ny\n\n' | python3 "$GODOT_SECURE_SCRIPT" godot > /tmp/godot_secure_apply.log 2>&1
          set -e
          if [ ! -s "godot/core/crypto/security_token.h" ]; then
            echo "ERROR: security_token.h was not generated."
            exit 1
          fi
          echo "[OK] Godot Secure applied."

      - name: Restore editor from cache
        if: steps.editor-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p godot/bin
          cp -a ~/.cache/gdio/windows-editor/* godot/bin/ 2>/dev/null || true

      - name: Build Windows editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          scons platform=windows target=editor arch=x86_64 ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} debug_symbols=no d3d12=no
          mkdir -p ~/.cache/gdio/windows-editor/
          cp bin/godot.windows.editor.x86_64*.exe ~/.cache/gdio/windows-editor/ 2>/dev/null || true
          if [ -d bin/GodotSharp ]; then
            cp -a bin/GodotSharp ~/.cache/gdio/windows-editor/GodotSharp
          fi

      - name: Build Windows templates (all arch, regular + console)
        if: steps.template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          for arch in x86_32 x86_64 arm64; do
            echo "[BUILD] Windows template_release $arch"
            scons platform=windows target=template_release arch=$arch ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no d3d12=no
            echo "[BUILD] Windows template_release $arch console"
            scons platform=windows target=template_release arch=$arch ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no d3d12=no windows_subsystem=console
          done

      - name: Install built templates
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$APPDATA/Godot/export_templates/$GODOT_TAG"
          CACHE_DIR="$HOME/.cache/gdio/windows-templates"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
            cp "$CACHE_DIR"/* "$TEMPLATE_DIR/" 2>/dev/null || true
            echo "[OK] Restored Windows templates from cache"
          else
            mkdir -p "$CACHE_DIR"
            cd godot/bin
            SUFFIX=${{ env.CSHARP == 'true' && '.mono' || '' }}
            for arch in x86_32 x86_64 arm64; do
              SRC="godot.windows.template_release.${arch}${SUFFIX}.exe"
              if [ -f "$SRC" ]; then
                cp "$SRC" "$TEMPLATE_DIR/windows_release_${arch}.exe"
                cp "$SRC" "$CACHE_DIR/windows_release_${arch}.exe"
                echo "[OK] windows_release_${arch}.exe"
              fi
              SRC_CONS="godot.windows.template_release.${arch}${SUFFIX}_console.exe"
              if [ -f "$SRC_CONS" ]; then
                cp "$SRC_CONS" "$TEMPLATE_DIR/windows_release_${arch}_console.exe"
                cp "$SRC_CONS" "$CACHE_DIR/windows_release_${arch}_console.exe"
                echo "[OK] windows_release_${arch}_console.exe"
              fi
            done
          fi
          echo "[OK] Templates installed to $TEMPLATE_DIR"
          ls -la "$TEMPLATE_DIR"

      - name: Detect binaries
        id: bins
        shell: bash
        run: |
          WINDOWS_EDITOR=${{ env.CSHARP == 'true' && 'godot.windows.editor.x86_64.mono.exe' || 'godot.windows.editor.x86_64.exe' }}
          echo "windows_editor=$(find godot/bin -maxdepth 1 -name "$WINDOWS_EDITOR" -type f | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Package editor
        shell: bash
        run: |
          mkdir -p package_editor
          cp "${{ steps.bins.outputs.windows_editor }}" package_editor/

      - name: Copy GodotSharp
        if: env.CSHARP == 'true'
        shell: bash
        run: |
          if [ -d "godot/bin/GodotSharp" ]; then
            cp -a godot/bin/GodotSharp package_editor/GodotSharp
          fi

      - name: Install gdio
        shell: pwsh
        run: curl.exe -fsSL https://raw.githubusercontent.com/SeremTitus/gdio/main/scripts/install.ps1 | powershell -Command -
      - name: Add gdio to PATH
        shell: pwsh
        run: echo "$env:LOCALAPPDATA\gdio\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bind compiled editor
        shell: bash
        run: |
          EDITOR_BIN=$(find package_editor -maxdepth 1 -type f -name "*.exe" | head -n 1)
          EDITOR_VERSION=$("$EDITOR_BIN" --version | xargs)
          gdio add "$EDITOR_BIN"
          gdio bind "$EDITOR_VERSION"

      - name: Import project if needed
        shell: bash
        run: |
          if [ ! -d .godot ]; then
            gdio args --import --headless
          fi
      - name: Export Windows presets
        run: gdio build --windows

      - name: Package artifacts
        run: python .github/workflows/ci_package.py exported_on_windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exported_on_windows
          path: exported_on_windows/
          if-no-files-found: warn

  secure-export-linux:
    needs: detect
    if: needs.detect.outputs.has_linux == 'true' || needs.detect.outputs.has_web == 'true' || needs.detect.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: env.CSHARP == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Validate AES-256 encryption key
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SCRIPT_AES256_ENCRYPTION_KEY"
          if [ -z "${SCRIPT_AES256_ENCRYPTION_KEY:-}" ]; then
            echo "ERROR: SCRIPT_AES256_ENCRYPTION_KEY is empty."
            exit 1
          fi
          if ! [[ "$SCRIPT_AES256_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Key must contain exactly 64 hexadecimal characters."
            exit 1
          fi
          echo "[OK] AES-256 key format is valid."

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: |
            ~/.scons_cache
            godot/.scons_cache
          key: scons-linux-${{ env.GODOT_TAG }}-${{ hashFiles('godot/**') }}
          restore-keys: scons-linux-${{ env.GODOT_TAG }}

      - name: Cache editor build
        id: editor-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/linux-editor/
          key: editor-linux-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: editor-linux-${{ env.GODOT_TAG }}

      - name: Cache Linux templates
        id: linux-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/linux-templates/
          key: templates-linux-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-linux-${{ env.GODOT_TAG }}

      - name: Cache Web templates
        id: web-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/web-templates/
          key: templates-web-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-web-${{ env.GODOT_TAG }}

      - name: Cache Android templates
        id: android-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/android-templates/
          key: templates-android-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-android-${{ env.GODOT_TAG }}

      - name: Install build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential scons pkg-config python3 python3-pip \
            mingw-w64 clang zip unzip curl git cmake openjdk-17-jdk
          sudo update-alternatives \
            --install /usr/bin/x86_64-w64-mingw32-g++ x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix 100
          sudo update-alternatives \
            --install /usr/bin/x86_64-w64-mingw32-gcc x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix 100

      - name: Setup Emscripten SDK
        if: steps.web-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          if [ ! -d "$HOME/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install latest
          ./emsdk activate latest
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Setup Android SDK/NDK
        if: steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          if [ ! -d "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME"
            curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools-tmp"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools-tmp/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$ANDROID_HOME/cmdline-tools-tmp" cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Clone Godot
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GODOT_BRANCH=$(echo "$GODOT_TAG" | sed 's/\.\([a-z].*\)/-\1/')
          if [ ! -d godot/.git ]; then
            rm -rf godot
            git clone --depth 1 --branch "$GODOT_BRANCH" \
              https://github.com/godotengine/godot.git godot
          fi

      - name: Download Godot-Secure script (latest release)
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          LATEST_URL=$(curl -fsSL -H "User-Agent: curl" https://api.github.com/repos/KnifeXRage/Godot-Secure/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*Godot\.Secure\.AES-256\.Universal\.[^"]*\.py"' \
            | head -1 | sed 's/"browser_download_url": *"//;s/"$//')
          if [ -z "$LATEST_URL" ]; then
            echo "ERROR: Could not find Godot-Secure script in latest release"
            exit 1
          fi
          GODOT_SECURE_SCRIPT=$(basename "$LATEST_URL")
          curl -fsSL -o "$GODOT_SECURE_SCRIPT" "$LATEST_URL"
          echo "GODOT_SECURE_SCRIPT=$GODOT_SECURE_SCRIPT" >> "$GITHUB_ENV"
          echo "[OK] Downloaded $GODOT_SECURE_SCRIPT"

      - name: Save baseline
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/godot_secure_baseline
          cp godot/core/io/file_access_pack.h /tmp/godot_secure_baseline/
          cp godot/core/io/file_access_encrypted.h /tmp/godot_secure_baseline/
          cp godot/core/io/file_access_encrypted.cpp /tmp/godot_secure_baseline/

      - name: Apply Godot Secure
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.linux-cache.outputs.cache-hit != 'true' ||
          steps.web-cache.outputs.cache-hit != 'true' ||
          steps.android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SCRIPT_AES256_ENCRYPTION_KEY="$SCRIPT_AES256_ENCRYPTION_KEY"
          set +e
          printf 'y\nn\ny\ny\n\n' | python3 "$GODOT_SECURE_SCRIPT" godot > /tmp/godot_secure_apply.log 2>&1
          set -e
          if [ ! -s "godot/core/crypto/security_token.h" ]; then
            echo "ERROR: security_token.h was not generated."
            tail -200 /tmp/godot_secure_apply.log | sed -E 's/[0-9A-Fa-f]{64}/[REDACTED]/g'
            exit 1
          fi
          if cmp -s /tmp/godot_secure_baseline/file_access_pack.h godot/core/io/file_access_pack.h; then
            echo "ERROR: file_access_pack.h was not modified."
            exit 1
          fi
          rm -f /tmp/godot_secure_apply.log
          echo "[OK] Godot Secure applied successfully."

      - name: Restore editor from cache
        if: steps.editor-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p godot/bin
          cp -a ~/.cache/gdio/linux-editor/* godot/bin/ 2>/dev/null || true

      - name: Build temporary Linux editor for .NET glue
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' && env.CSHARP == 'true'
        shell: bash
        run: |
          cd godot
          scons platform=linuxbsd target=editor arch=x86_64 module_mono_enabled=yes debug_symbols=no

      - name: Generate .NET glue
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' && env.CSHARP == 'true'
        shell: bash
        run: |
          EDITOR=$(find godot/bin -maxdepth 1 -type f -name "godot.linuxbsd.editor.x86_64.mono" | head -n 1)
          chmod +x "$EDITOR"
          "$EDITOR" --headless --generate-mono-glue godot/modules/mono/glue

      - name: Configure local Godot NuGet source
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' && env.CSHARP == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/godot-nuget"
          dotnet nuget remove source GodotLocal >/dev/null 2>&1 || true
          dotnet nuget add source "$HOME/godot-nuget" --name GodotLocal

      - name: Build Linux editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          scons platform=linuxbsd target=editor arch=x86_64 ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} debug_symbols=no
          mkdir -p ~/.cache/gdio/linux-editor/
          cp bin/godot.linuxbsd.editor.x86_64* ~/.cache/gdio/linux-editor/ 2>/dev/null || true
          if [ -d bin/GodotSharp ]; then
            cp -a bin/GodotSharp ~/.cache/gdio/linux-editor/GodotSharp
          fi

      - name: Build Linux release templates (all arch)
        if: steps.linux-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          for arch in x86_32 x86_64 arm32 arm64; do
            echo "[BUILD] Linux template_release $arch"
            scons platform=linuxbsd target=template_release arch=$arch ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no
          done

      - name: Build Web release templates (all variants)
        if: steps.web-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          source "$HOME/emsdk/emsdk_env.sh" 2>/dev/null
          cd godot
          COMMON="target=template_release ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no"
          echo "[BUILD] Web template_release (standard)"
          scons platform=web $COMMON
          echo "[BUILD] Web template_release (dlink)"
          scons platform=web $COMMON dlink_enabled=yes
          echo "[BUILD] Web template_release (nothreads)"
          scons platform=web $COMMON threads=no
          echo "[BUILD] Web template_release (dlink+nothreads)"
          scons platform=web $COMMON dlink_enabled=yes threads=no

      - name: Build Android release template
        if: steps.android-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_android == 'true'
        shell: bash
        run: |
          cd godot
          scons platform=android target=template_release arch=arm64 ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no

      - name: Install Linux templates
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_TAG"
          CACHE_DIR="$HOME/.cache/gdio/linux-templates"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
            cp "$CACHE_DIR"/* "$TEMPLATE_DIR/" 2>/dev/null || true
            echo "[OK] Restored Linux templates from cache"
          else
            mkdir -p "$CACHE_DIR"
            cd godot/bin
            SUFFIX=${{ env.CSHARP == 'true' && '.mono' || '' }}
            for arch in x86_32 x86_64 arm32 arm64; do
              SRC="godot.linuxbsd.template_release.${arch}${SUFFIX}"
              if [ -f "$SRC" ]; then
                cp "$SRC" "$TEMPLATE_DIR/linux_release.${arch}"
                cp "$SRC" "$CACHE_DIR/linux_release.${arch}"
                echo "[OK] linux_release.${arch}"
              fi
            done
          fi

      - name: Install Web templates
        if: needs.detect.outputs.has_web == 'true'
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_TAG"
          CACHE_DIR="$HOME/.cache/gdio/web-templates"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
            cp "$CACHE_DIR"/* "$TEMPLATE_DIR/" 2>/dev/null || true
            echo "[OK] Restored Web templates from cache"
          else
            mkdir -p "$CACHE_DIR"
            cd godot/bin
            zip -j "$TEMPLATE_DIR/web_release.zip" godot.web.template_release.wasm32*.js godot.web.template_release.wasm32*.wasm && echo "[OK] web_release.zip"
            zip -j "$CACHE_DIR/web_release.zip" godot.web.template_release.wasm32*.js godot.web.template_release.wasm32*.wasm
            zip -j "$TEMPLATE_DIR/web_dlink_release.zip" godot.web.template_release.wasm32.dlink.js godot.web.template_release.wasm32.dlink.wasm godot.side.web.template_release.wasm32.dlink.wasm && echo "[OK] web_dlink_release.zip"
            zip -j "$CACHE_DIR/web_dlink_release.zip" godot.web.template_release.wasm32.dlink.js godot.web.template_release.wasm32.dlink.wasm godot.side.web.template_release.wasm32.dlink.wasm
            zip -j "$TEMPLATE_DIR/web_nothreads_release.zip" godot.web.template_release.wasm32.nothreads.js godot.web.template_release.wasm32.nothreads.wasm && echo "[OK] web_nothreads_release.zip"
            zip -j "$CACHE_DIR/web_nothreads_release.zip" godot.web.template_release.wasm32.nothreads.js godot.web.template_release.wasm32.nothreads.wasm
            zip -j "$TEMPLATE_DIR/web_dlink_nothreads_release.zip" godot.web.template_release.wasm32.nothreads.dlink.js godot.web.template_release.wasm32.nothreads.dlink.wasm godot.side.web.template_release.wasm32.nothreads.dlink.wasm && echo "[OK] web_dlink_nothreads_release.zip"
            zip -j "$CACHE_DIR/web_dlink_nothreads_release.zip" godot.web.template_release.wasm32.nothreads.dlink.js godot.web.template_release.wasm32.nothreads.dlink.wasm godot.side.web.template_release.wasm32.nothreads.dlink.wasm
          fi

      - name: Install Android templates
        if: needs.detect.outputs.has_android == 'true'
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_TAG"
          CACHE_DIR="$HOME/.cache/gdio/android-templates"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
            cp "$CACHE_DIR"/* "$TEMPLATE_DIR/" 2>/dev/null || true
            echo "[OK] Restored Android templates from cache"
          else
            mkdir -p "$CACHE_DIR"
            cd godot/bin
            if [ -f godot.android.template_release.arm64 ]; then
              cp godot.android.template_release.arm64 "$TEMPLATE_DIR/android_release.apk"
              cp godot.android.template_release.arm64 "$CACHE_DIR/android_release.apk"
              echo "[OK] android_release.apk"
            fi
          fi

      - name: Detect binaries
        id: bins
        shell: bash
        run: |
          LINUX_EDITOR=${{ env.CSHARP == 'true' && 'godot.linuxbsd.editor.x86_64.mono' || 'godot.linuxbsd.editor.x86_64' }}
          LINUX_TEMPLATE=${{ env.CSHARP == 'true' && 'godot.linuxbsd.template_release.x86_64.mono' || 'godot.linuxbsd.template_release.x86_64' }}
          WEB_TEMPLATE=${{ env.CSHARP == 'true' && 'godot.web.template_release.wasm32.mono' || 'godot.web.template_release.wasm32' }}
          ANDROID_TEMPLATE=${{ env.CSHARP == 'true' && 'godot.android.template_release.arm64.mono' || 'godot.android.template_release.arm64' }}
          echo "linux_editor=$(find godot/bin -maxdepth 1 -name "$LINUX_EDITOR" -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "linux_template=$(find godot/bin -maxdepth 1 -name "$LINUX_TEMPLATE" -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "web_template=$(find godot/bin -maxdepth 1 -name "$WEB_TEMPLATE*" -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "android_template=$(find godot/bin -maxdepth 1 -name "$ANDROID_TEMPLATE*" -type f | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Package editor
        shell: bash
        run: |
          mkdir -p package_editor
          cp "${{ steps.bins.outputs.linux_editor }}" package_editor/
          chmod +x package_editor/*

      - name: Copy GodotSharp
        if: env.CSHARP == 'true'
        shell: bash
        run: |
          if [ -d "godot/bin/GodotSharp" ]; then
            cp -a godot/bin/GodotSharp package_editor/GodotSharp
          fi

      - name: Install gdio
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/SeremTitus/gdio/main/scripts/install.sh | bash || true
      - name: Add gdio to PATH
        shell: bash
        run: echo "$HOME/.gdio/bin" >> "$GITHUB_PATH"

      - name: Bind compiled editor
        shell: bash
        run: |
          EDITOR_BIN=$(find package_editor -maxdepth 1 -type f -executable | head -n 1)
          chmod +x "$EDITOR_BIN"
          EDITOR_VERSION=$("$EDITOR_BIN" --version | xargs)
          gdio add "$EDITOR_BIN"
          gdio bind "$EDITOR_VERSION"

      - name: Import project if needed
        shell: bash
        run: |
          if [ ! -d .godot ]; then
            gdio args --import --headless
          fi
      - name: Export Linux presets
        if: needs.detect.outputs.has_linux == 'true'
        run: gdio build --linux
      - name: Export Web presets
        if: needs.detect.outputs.has_web == 'true'
        run: gdio build --web
      - name: Export Android presets
        if: needs.detect.outputs.has_android == 'true'
        run: gdio build --android

      - name: Package artifacts
        run: python .github/workflows/ci_package.py exported_on_linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exported_on_linux
          path: exported_on_linux/
          if-no-files-found: warn

  secure-export-macos:
    needs: detect
    if: needs.detect.outputs.has_macos == 'true' || needs.detect.outputs.has_ios == 'true' || needs.detect.outputs.has_visionos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: env.CSHARP == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Validate AES-256 encryption key
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SCRIPT_AES256_ENCRYPTION_KEY"
          if [ -z "${SCRIPT_AES256_ENCRYPTION_KEY:-}" ]; then
            echo "ERROR: SCRIPT_AES256_ENCRYPTION_KEY is empty."
            exit 1
          fi
          if ! [[ "$SCRIPT_AES256_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Key must contain exactly 64 hex characters."
            exit 1
          fi
          echo "[OK] AES-256 key format is valid."

      - name: Cache SCons build
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/SCons
            godot/.scons_cache
          key: scons-macos-${{ env.GODOT_TAG }}-${{ hashFiles('godot/**') }}
          restore-keys: scons-macos-${{ env.GODOT_TAG }}

      - name: Cache editor build
        id: editor-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/macos-editor/
          key: editor-macos-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: editor-macos-${{ env.GODOT_TAG }}

      - name: Cache macOS templates
        id: macos-template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/macos-templates/
          key: templates-macos-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-macos-${{ env.GODOT_TAG }}

      - name: Cache iOS templates
        id: ios-template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/ios-templates/
          key: templates-ios-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-ios-${{ env.GODOT_TAG }}

      - name: Cache visionOS templates
        id: visionos-template-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gdio/visionos-templates/
          key: templates-visionos-${{ env.GODOT_TAG }}-${{ env.CSHARP }}
          restore-keys: templates-visionos-${{ env.GODOT_TAG }}

      - name: Install build dependencies
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install scons python3

      - name: Clone Godot
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GODOT_BRANCH=$(echo "$GODOT_TAG" | sed 's/\.\([a-z].*\)/-\1/')
          if [ ! -d godot/.git ]; then
            rm -rf godot
            git clone --depth 1 --branch "$GODOT_BRANCH" \
              https://github.com/godotengine/godot.git godot
          fi

      - name: Download Godot-Secure script (latest release)
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          LATEST_URL=$(curl -fsSL -H "User-Agent: curl" https://api.github.com/repos/KnifeXRage/Godot-Secure/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*Godot\.Secure\.AES-256\.Universal\.[^"]*\.py"' \
            | head -1 | sed 's/"browser_download_url": *"//;s/"$//')
          if [ -z "$LATEST_URL" ]; then
            echo "ERROR: Could not find Godot-Secure script in latest release"
            exit 1
          fi
          GODOT_SECURE_SCRIPT=$(basename "$LATEST_URL")
          curl -fsSL -o "$GODOT_SECURE_SCRIPT" "$LATEST_URL"
          echo "GODOT_SECURE_SCRIPT=$GODOT_SECURE_SCRIPT" >> "$GITHUB_ENV"
          echo "[OK] Downloaded $GODOT_SECURE_SCRIPT"

      - name: Save baseline
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/godot_secure_baseline
          cp godot/core/io/file_access_pack.h /tmp/godot_secure_baseline/
          cp godot/core/io/file_access_encrypted.h /tmp/godot_secure_baseline/
          cp godot/core/io/file_access_encrypted.cpp /tmp/godot_secure_baseline/

      - name: Apply Godot Secure
        if: >-
          steps.editor-cache.outputs.cache-hit != 'true' ||
          steps.macos-template-cache.outputs.cache-hit != 'true' ||
          steps.ios-template-cache.outputs.cache-hit != 'true' ||
          steps.visionos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SCRIPT_AES256_ENCRYPTION_KEY="$SCRIPT_AES256_ENCRYPTION_KEY"
          set +e
          printf 'y\nn\ny\ny\n\n' | python3 "$GODOT_SECURE_SCRIPT" godot > /tmp/godot_secure_apply.log 2>&1
          set -e
          if [ ! -s "godot/core/crypto/security_token.h" ]; then
            echo "ERROR: security_token.h was not generated."
            exit 1
          fi
          echo "[OK] Godot Secure applied."

      - name: Restore editor from cache
        if: steps.editor-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p godot/bin
          cp -a ~/.cache/gdio/macos-editor/* godot/bin/ 2>/dev/null || true

      - name: Build macOS editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          scons platform=macos target=editor arch=x86_64 ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} debug_symbols=no
          mkdir -p ~/.cache/gdio/macos-editor/
          cp bin/godot.macos.editor.x86_64* ~/.cache/gdio/macos-editor/ 2>/dev/null || true
          if [ -d bin/GodotSharp ]; then
            cp -a bin/GodotSharp ~/.cache/gdio/macos-editor/GodotSharp
          fi

      - name: Build macOS release templates (all arch)
        if: steps.macos-template-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd godot
          for arch in x86_64 arm64; do
            echo "[BUILD] macOS template_release $arch"
            scons platform=macos target=template_release arch=$arch ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no
          done

      - name: Build iOS release template
        if: steps.ios-template-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_ios == 'true'
        shell: bash
        run: |
          cd godot
          echo "[BUILD] iOS template_release"
          scons platform=ios target=template_release arch=arm64 ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no

      - name: Build visionOS release template
        if: steps.visionos-template-cache.outputs.cache-hit != 'true' && needs.detect.outputs.has_visionos == 'true'
        shell: bash
        run: |
          cd godot
          echo "[BUILD] visionOS template_release"
          scons platform=visionos target=template_release arch=arm64 ${{ env.CSHARP == 'true' && 'module_mono_enabled=yes' || '' }} production=yes debug_symbols=no lto=auto disable_path_overrides=no

      - name: Install macOS templates
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/$GODOT_TAG"
          CACHE_DIR="$HOME/.cache/gdio/macos-templates"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
            cp "$CACHE_DIR"/* "$TEMPLATE_DIR/" 2>/dev/null || true
            echo "[OK] Restored macOS templates from cache"
          else
            mkdir -p "$CACHE_DIR"
            cd godot/bin
            MACOS_FILES=""
            for arch in x86_64 arm64; do
              if [ -f "godot.macos.template_release.${arch}" ]; then
                MACOS_FILES="$MACOS_FILES godot.macos.template_release.${arch}"
                echo "[OK] Found macOS template $arch"
              fi
            done
            if [ -n "$MACOS_FILES" ]; then
              zip -j "$TEMPLATE_DIR/macos.zip" $MACOS_FILES
              zip -j "$CACHE_DIR/macos.zip" $MACOS_FILES
              echo "[OK] Installed macos.zip"
            fi
          fi

      - name: Install iOS templates
        if: needs.detect.outputs.has_ios == 'true'
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/$GODOT_TAG"
          CACHE_DIR="$HOME/.cache/gdio/ios-templates"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
            cp "$CACHE_DIR"/* "$TEMPLATE_DIR/" 2>/dev/null || true
            echo "[OK] Restored iOS templates from cache"
          else
            mkdir -p "$CACHE_DIR"
            cd godot/bin
            if [ -f godot.ios.template_release.arm64 ]; then
              zip -j "$TEMPLATE_DIR/ios.zip" godot.ios.template_release.arm64
              zip -j "$CACHE_DIR/ios.zip" godot.ios.template_release.arm64
              echo "[OK] ios.zip"
            fi
          fi

      - name: Install visionOS templates
        if: needs.detect.outputs.has_visionos == 'true'
        shell: bash
        run: |
          set -e
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/$GODOT_TAG"
          CACHE_DIR="$HOME/.cache/gdio/visionos-templates"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$CACHE_DIR" ] && [ "$(ls -A $CACHE_DIR 2>/dev/null)" ]; then
            cp "$CACHE_DIR"/* "$TEMPLATE_DIR/" 2>/dev/null || true
            echo "[OK] Restored visionOS templates from cache"
          else
            mkdir -p "$CACHE_DIR"
            cd godot/bin
            if [ -f godot.visionos.template_release.arm64 ]; then
              zip -j "$TEMPLATE_DIR/ios.zip" godot.visionos.template_release.arm64
              zip -j "$CACHE_DIR/ios.zip" godot.visionos.template_release.arm64
              echo "[OK] ios.zip (visionOS)"
            fi
          fi

      - name: Detect binaries
        id: bins
        shell: bash
        run: |
          echo "macos_editor=$(find godot/bin -maxdepth 1 -name 'godot.macos.editor.x86_64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "macos_template=$(find godot/bin -maxdepth 1 -name 'godot.macos.template_release.x86_64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "ios_template=$(find godot/bin -maxdepth 1 -name 'godot.ios.template_release.arm64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "visionos_template=$(find godot/bin -maxdepth 1 -name 'godot.visionos.template_release.arm64' -type f | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Package editor
        shell: bash
        run: |
          mkdir -p package_editor
          cp "${{ steps.bins.outputs.macos_editor }}" package_editor/
          chmod +x package_editor/*

      - name: Install gdio
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/SeremTitus/gdio/main/scripts/install.sh | bash || true
      - name: Add gdio to PATH
        shell: bash
        run: echo "$HOME/.gdio/bin" >> "$GITHUB_PATH"

      - name: Bind compiled editor
        shell: bash
        run: |
          EDITOR_BIN=$(find package_editor -maxdepth 1 -type f -executable | head -n 1)
          chmod +x "$EDITOR_BIN"
          EDITOR_VERSION=$("$EDITOR_BIN" --version | xargs)
          gdio add "$EDITOR_BIN"
          gdio bind "$EDITOR_VERSION"

      - name: Import project if needed
        shell: bash
        run: |
          if [ ! -d .godot ]; then
            gdio args --import --headless
          fi
      - name: Export macOS presets
        if: needs.detect.outputs.has_macos == 'true'
        run: gdio build --macos
      - name: Export iOS presets
        if: needs.detect.outputs.has_ios == 'true'
        run: gdio build --ios
      - name: Export visionOS presets
        if: needs.detect.outputs.has_visionos == 'true'
        run: gdio build --visionos

      - name: Package artifacts
        run: python .github/workflows/ci_package.py exported_on_macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exported_on_macos
          path: exported_on_macos/
          if-no-files-found: warn
