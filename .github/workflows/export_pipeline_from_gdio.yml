name: gdio Export Pipeline

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_windows: ${{ steps.check.outputs.has_windows }}
      has_linux: ${{ steps.check.outputs.has_linux }}
      has_macos: ${{ steps.check.outputs.has_macos }}
      has_web: ${{ steps.check.outputs.has_web }}
      has_android: ${{ steps.check.outputs.has_android }}
      has_ios: ${{ steps.check.outputs.has_ios }}
      has_visionos: ${{ steps.check.outputs.has_visionos }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect platforms from export presets
        id: check
        shell: bash
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "No export_presets.cfg found."
            for p in has_windows has_linux has_macos has_web has_android has_ios has_visionos; do
              echo "$p=false" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          has_windows=false; has_linux=false; has_macos=false
          has_web=false; has_android=false; has_ios=false; has_visionos=false
          while IFS= read -r line; do
            val="${line#*\"}"; val="${val%\"*}"
            case "$val" in
              "Windows"|"Windows Desktop") has_windows=true ;;
              "Linux"|"Linux/X11") has_linux=true ;;
              "macOS"|"Mac OSX") has_macos=true ;;
              "Web"|"HTML5") has_web=true ;;
              "Android") has_android=true ;;
              "iOS") has_ios=true ;;
              "visionOS") has_visionos=true ;;
            esac
          done < <(grep '^platform=' export_presets.cfg)
          echo "has_windows=$has_windows" >> "$GITHUB_OUTPUT"
          echo "has_linux=$has_linux" >> "$GITHUB_OUTPUT"
          echo "has_macos=$has_macos" >> "$GITHUB_OUTPUT"
          echo "has_web=$has_web" >> "$GITHUB_OUTPUT"
          echo "has_android=$has_android" >> "$GITHUB_OUTPUT"
          echo "has_ios=$has_ios" >> "$GITHUB_OUTPUT"
          echo "has_visionos=$has_visionos" >> "$GITHUB_OUTPUT"
  export-windows:
    needs: detect
    if: needs.detect.outputs.has_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gdio
        shell: pwsh
        run: curl.exe -fsSL https://gdio.seremtitus.co.ke/install.ps1 | powershell -Command -
      - name: Add gdio to PATH
        shell: pwsh
        run: echo "$env:LOCALAPPDATA\gdio\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Add Godot editor
        run: gdio add 4.7.2 
      - name: Bind editor
        run: gdio bind 4.7.2 

      - name: Download Windows export templates
        run: gdio templates add 4.7.2 --windows
      - name: Export Windows presets
        run: gdio build --windows
      - name: Set repo name
        shell: bash
        run: echo "GITHUB_REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
      - name: Package artifacts
        shell: pwsh
        run: |
          if (Test-Path export_presets.cfg) {
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            $game = $env:GITHUB_REPO_NAME
            $presets = @()
            $cur = @{}
            switch -Regex -File export_presets.cfg {
              '^\[preset' { if ($cur.name) { $presets += [pscustomobject]$cur }; $cur = @{} }
              '^name="([^"]*)"'              { $cur.name = $Matches[1] }
              '^platform="([^"]*)"'          { $cur.platform = $Matches[1] }
              '^export_path="([^"]*)"'       { $cur.export_path = $Matches[1] }
              '^binary_format/architecture="([^"]*)"' { $cur.arch = $Matches[1] }
            }
            if ($cur.name) { $presets += [pscustomobject]$cur }
            foreach ($p in $presets) {
              $plat = switch ($p.platform) {
                { $_ -in "Windows","Windows Desktop" } { "windows" }
                { $_ -in "Linux","Linux/X11" } { "linux" }
                { $_ -in "macOS","Mac OSX" } { "macos" }
                { $_ -in "Web","HTML5" } { "web" }
                "Android" { "android" }
                "iOS" { "ios" }
                "visionOS" { "visionos" }
                default { $p.platform.ToLower() }
              }
              $ps = ($p.name.ToLower() -replace '[^a-z0-9]','_')
              $pj = ($game.ToLower() -replace '[^a-z0-9]','_')
              $arch = if ($p.arch) { $p.arch } else { "x86_64" }
              if ($p.export_path) { $file = $p.export_path }
              else {
                $file = switch ($plat) {
                  "web"         { "export/$ps/index.html" }
                  "linux"       { "export/$ps/${pj}.${arch}" }
                  "windows"     { "export/$ps/${pj}.exe" }
                  "macos"       { "export/$ps/${pj}.app" }
                  "android"     { "export/$ps/${pj}.apk" }
                  { $_ -in "ios","visionos" } { "export/$ps/${pj}.ipa" }
                  default       { "export/$ps/${pj}" }
                }
              }
              if (Test-Path $file) {
                $dir = Split-Path $file -Parent
                Compress-Archive -Path "$dir/*" -DestinationPath "artifacts/${game}_${ps}.zip"
              }
            }
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exports-windows
          path: artifacts/*.zip
          if-no-files-found: ignore

  export-linux:
    needs: detect
    if: needs.detect.outputs.has_linux == 'true' || needs.detect.outputs.has_web == 'true' || needs.detect.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gdio
        shell: bash
        run: curl -fsSL https://gdio.seremtitus.co.ke/install.sh | bash || true
      - name: Add gdio to PATH
        shell: bash
        run: echo "$HOME/.gdio/bin" >> "$GITHUB_PATH"
      - name: Add Godot editor
        run: gdio add 4.7.2 
      - name: Bind editor
        run: gdio bind 4.7.2 

      - name: Download Linux export templates
        run: gdio templates add 4.7.2 --linux
      - name: Export Linux presets
        run: gdio build --linux
      - name: Download Web export templates
        run: gdio templates add 4.7.2 --web
      - name: Export Web presets
        run: gdio build --web
      - name: Download Android export templates
        run: gdio templates add 4.7.2 --android
      - name: Export Android presets
        run: gdio build --android
      - name: Set repo name
        shell: bash
        run: echo "GITHUB_REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
      - name: Package artifacts
        shell: bash
        run: |
          if [ -f export_presets.cfg ]; then
            mkdir -p artifacts
            game="${GITHUB_REPO_NAME}"
            _name="" _platform="" _export_path="" _arch="x86_64"
            _flush() {
              [ -z "$_name" ] && return
              case "$_platform" in
                "Windows"|"Windows Desktop") _plat="windows" ;;
                "Linux"|"Linux/X11") _plat="linux" ;;
                "macOS"|"Mac OSX") _plat="macos" ;;
                "Web"|"HTML5") _plat="web" ;;
                "Android") _plat="android" ;;
                "iOS") _plat="ios" ;;
                "visionOS") _plat="visionos" ;;
                *) _plat=$(echo "$_platform" | tr '[:upper:]' '[:lower:]') ;;
              esac
              _ps=$(echo "$_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
              _pj=$(echo "$game" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
              if [ -n "$_export_path" ]; then
                _file="$_export_path"
              else
                case "$_plat" in
                  web)         _file="export/$_ps/index.html" ;;
                  linux)       _file="export/$_ps/${_pj}.${_arch}" ;;
                  windows)     _file="export/$_ps/${_pj}.exe" ;;
                  macos)       _file="export/$_ps/${_pj}.app" ;;
                  android)     _file="export/$_ps/${_pj}.apk" ;;
                  ios|visionos) _file="export/$_ps/${_pj}.ipa" ;;
                  *)           _file="export/$_ps/${_pj}" ;;
                esac
              fi
              if [ -f "$_file" ]; then
                _dir=$(dirname "$_file")
                zip -qr "artifacts/${game}_${_ps}.zip" "$_dir"
              fi
            }
            while IFS= read -r line; do
              if [[ "$line" =~ ^\[preset\. ]]; then
                _flush
                _name="" _platform="" _export_path="" _arch="x86_64"
              fi
              [[ "$line" =~ ^name=\"([^\"]*)\" ]] && _name="${BASH_REMATCH[1]}"
              [[ "$line" =~ ^platform=\"([^\"]*)\" ]] && _platform="${BASH_REMATCH[1]}"
              [[ "$line" =~ ^export_path=\"([^\"]*)\" ]] && _export_path="${BASH_REMATCH[1]}"
              [[ "$line" =~ ^binary_format/architecture=\"([^\"]*)\" ]] && _arch="${BASH_REMATCH[1]}"
            done < export_presets.cfg
            _flush
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exports-linux
          path: artifacts/*.zip
          if-no-files-found: ignore

  export-macos:
    needs: detect
    if: needs.detect.outputs.has_macos == 'true' || needs.detect.outputs.has_ios == 'true' || needs.detect.outputs.has_visionos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gdio
        shell: bash
        run: curl -fsSL https://gdio.seremtitus.co.ke/install.sh | bash || true
      - name: Add gdio to PATH
        shell: bash
        run: echo "$HOME/.gdio/bin" >> "$GITHUB_PATH"
      - name: Add Godot editor
        run: gdio add 4.7.2 
      - name: Bind editor
        run: gdio bind 4.7.2 

      - name: Download macOS export templates
        run: gdio templates add 4.7.2 --macos
      - name: Export macOS presets
        run: gdio build --macos
      - name: Download iOS export templates
        run: gdio templates add 4.7.2 --ios
      - name: Export iOS presets
        run: gdio build --ios
      - name: Download visionOS export templates
        run: gdio templates add 4.7.2 --visionos
      - name: Export visionOS presets
        run: gdio build --visionos
      - name: Set repo name
        shell: bash
        run: echo "GITHUB_REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
      - name: Package artifacts
        shell: bash
        run: |
          if [ -f export_presets.cfg ]; then
            mkdir -p artifacts
            game="${GITHUB_REPO_NAME}"
            _name="" _platform="" _export_path="" _arch="x86_64"
            _flush() {
              [ -z "$_name" ] && return
              case "$_platform" in
                "Windows"|"Windows Desktop") _plat="windows" ;;
                "Linux"|"Linux/X11") _plat="linux" ;;
                "macOS"|"Mac OSX") _plat="macos" ;;
                "Web"|"HTML5") _plat="web" ;;
                "Android") _plat="android" ;;
                "iOS") _plat="ios" ;;
                "visionOS") _plat="visionos" ;;
                *) _plat=$(echo "$_platform" | tr '[:upper:]' '[:lower:]') ;;
              esac
              _ps=$(echo "$_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
              _pj=$(echo "$game" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
              if [ -n "$_export_path" ]; then
                _file="$_export_path"
              else
                case "$_plat" in
                  web)         _file="export/$_ps/index.html" ;;
                  linux)       _file="export/$_ps/${_pj}.${_arch}" ;;
                  windows)     _file="export/$_ps/${_pj}.exe" ;;
                  macos)       _file="export/$_ps/${_pj}.app" ;;
                  android)     _file="export/$_ps/${_pj}.apk" ;;
                  ios|visionos) _file="export/$_ps/${_pj}.ipa" ;;
                  *)           _file="export/$_ps/${_pj}" ;;
                esac
              fi
              if [ -f "$_file" ]; then
                _dir=$(dirname "$_file")
                zip -qr "artifacts/${game}_${_ps}.zip" "$_dir"
              fi
            }
            while IFS= read -r line; do
              if [[ "$line" =~ ^\[preset\. ]]; then
                _flush
                _name="" _platform="" _export_path="" _arch="x86_64"
              fi
              [[ "$line" =~ ^name=\"([^\"]*)\" ]] && _name="${BASH_REMATCH[1]}"
              [[ "$line" =~ ^platform=\"([^\"]*)\" ]] && _platform="${BASH_REMATCH[1]}"
              [[ "$line" =~ ^export_path=\"([^\"]*)\" ]] && _export_path="${BASH_REMATCH[1]}"
              [[ "$line" =~ ^binary_format/architecture=\"([^\"]*)\" ]] && _arch="${BASH_REMATCH[1]}"
            done < export_presets.cfg
            _flush
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: exports-macos
          path: artifacts/*.zip
          if-no-files-found: ignore

  package:
    needs: [export-windows, export-linux, export-macos]
    if: always() && (needs.export-windows.result == 'success' || needs.export-linux.result == 'success' || needs.export-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all exports
        uses: actions/download-artifact@v8
        with:
          pattern: exports-*
          path: downloads/

      - name: Create aggregated zip
        run: |
          cd downloads
          mkdir -p flattened
          for z in exports-*/*.zip; do unzip -qo "$z" -d flattened; done
          cd flattened
          zip -qr ../../all_exports.zip .

      - name: Upload aggregated artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-exports
          path: all_exports.zip
          if-no-files-found: ignore
